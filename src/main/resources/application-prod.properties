# Perfil prod (único entorno además de dev): todos los valores sensibles por variables de entorno,
# sin valores por defecto. Obligatorias: DB_URL, DB_USERNAME, DB_PASSWORD, APP_JWT_SECRET,
# APP_CORS_ALLOWED_ORIGINS y, solo en el primer arranque, APP_ADMIN_INITIAL_PASSWORD.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
spring.task.scheduling.enabled=true
logging.file.path=${APP_LOG_PATH:/app/logs}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Detrás de un proxy inverso (nginx, etc.): toma la IP real del cliente de X-Forwarded-For solo si la
# petición viene de una red interna (RemoteIpValve de Tomcat). Sin esto, el límite de intentos de login
# vería a todos los usuarios con la IP del proxy y 10 fallos de cualquiera bloquearían el login de todos.
server.forward-headers-strategy=native

# Nunca exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
