spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

info.app.name=Ciudad de Refugio
info.app.description=Sistema de atencion y gestion de pedidos
info.app.version=1.0.0

server.servlet.context-path=/cdr
server.port=8086
spring.jackson.time-zone=America/La_Paz

# JWT (decisión aprobada: 12 h + refresh 7 días). El secreto SIEMPRE por variable de entorno.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=12h
app.jwt.refresh-expiration=7d

# Usuario ADMIN inicial: se crea en el primer arranque si no existe ningún ADMIN.
# Si la variable está vacía no se crea (fail-closed).
app.admin.initial-username=admin
app.admin.initial-password=${APP_ADMIN_INITIAL_PASSWORD:}

# Datasource (credenciales por variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000

# Esquema gestionado SOLO por Flyway (desviación aprobada respecto a la referencia)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public,security
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=warn

# Límite de intentos fallidos de login (igual que la referencia)
app.login.rate-limit.enabled=true
app.login.rate-limit.max-attempts=10
app.login.rate-limit.window=15m
