# Mensajes de Jakarta Validation por clave: message = "{entidad.campo.regla}"

# ----- Comunes -----
common.active.not-null=Debe indicar si el registro está activo.
common.description.size=La descripción admite como máximo {max} caracteres.
common.image.invalid=La imagen no es válida o supera el tamaño máximo de 1 MB.
common.price.not-null=El precio es obligatorio.
common.price.min=El precio no puede ser negativo.
common.price.digits=El precio admite como máximo {integer} enteros y {fraction} decimales.

# ----- Autenticación -----
auth.username.not-blank=El nombre de usuario es obligatorio.
auth.password.not-blank=La contraseña es obligatoria.
auth.refreshToken.not-blank=El refresh token es obligatorio.

# ----- Usuarios -----
user.username.not-blank=El nombre de usuario es obligatorio.
user.username.pattern=El nombre de usuario debe tener entre 3 y 50 caracteres: letras, números, punto, guion o guion bajo.
user.fullName.not-blank=El nombre completo es obligatorio.
user.fullName.size=El nombre completo debe tener entre {min} y {max} caracteres.
user.email.invalid=El correo no tiene un formato válido.
user.email.size=El correo admite como máximo {max} caracteres.
user.password.not-blank=La contraseña es obligatoria.
user.password.size=La contraseña debe tener entre {min} y {max} caracteres.
user.roleIds.not-empty=Debe asignar al menos un rol.

# ----- Roles -----
role.name.not-blank=El nombre del rol es obligatorio.
role.name.size=El nombre del rol debe tener entre {min} y {max} caracteres.
role.code.not-blank=El código del rol es obligatorio.
role.code.pattern=El código del rol debe tener entre 3 y 15 letras o guiones bajos.
role.description.size=La descripción del rol admite como máximo {max} caracteres.
role.permissionIds.not-null=Debe enviar la lista de permisos (puede estar vacía).

# ----- Categorías -----
category.name.not-blank=El nombre de la categoría es obligatorio.
category.name.size=El nombre de la categoría debe tener entre {min} y {max} caracteres.
category.ranking.not-null=El orden es obligatorio.
category.ranking.min=El orden no puede ser menor que {value}.
category.ranking.max=El orden no puede ser mayor que {value}.

# ----- Productos -----
product.categoryId.not-null=La categoría es obligatoria.
product.categoryId.positive=La categoría no es válida.
product.name.not-blank=El nombre del producto es obligatorio.
product.name.size=El nombre del producto debe tener entre {min} y {max} caracteres.
product.available.not-null=Debe indicar si el producto está disponible.

# ----- Adicionales -----
addon.name.not-blank=El nombre del adicional es obligatorio.
addon.name.size=El nombre del adicional debe tener entre {min} y {max} caracteres.

# ----- Números de mesa (adornos) -----
tableMarker.number.not-null=El número es obligatorio.
tableMarker.number.min=El número debe ser mayor o igual a {value}.
tableMarker.number.max=El número debe ser menor o igual a {value}.
tableMarker.description.size=La descripción admite como máximo {max} caracteres.

# ----- Medios de pago -----
paymentMethod.code.not-blank=El código del medio de pago es obligatorio.
paymentMethod.code.pattern=El código debe tener entre 2 y 30 letras, números o guiones bajos.
paymentMethod.name.not-blank=El nombre del medio de pago es obligatorio.
paymentMethod.name.size=El nombre del medio de pago debe tener entre {min} y {max} caracteres.
paymentMethod.requiresReference.not-null=Debe indicar si el medio de pago exige referencia.
paymentMethod.givesChange.not-null=Debe indicar si el medio de pago calcula vuelto.

# ----- Parámetros -----
parameter.value.not-blank=El valor del parámetro es obligatorio.
parameter.value.size=El valor admite como máximo {max} caracteres.

# ----- Importes (comunes) -----
common.amount.not-null=El importe es obligatorio.
common.amount.positive=El importe debe ser mayor a 0.
common.amount.digits=El importe admite como máximo {integer} enteros y {fraction} decimales.

# ----- Caja -----
cash.openingAmount.not-null=El monto de apertura es obligatorio.
cash.openingAmount.min=El monto de apertura no puede ser negativo.
cash.movement.type.invalid=El tipo de movimiento debe ser INCOME (ingreso) o EXPENSE (egreso).
cash.movement.description.not-blank=La descripción del movimiento es obligatoria.
cash.movement.description.size=La descripción admite como máximo {max} caracteres.

# ----- Pagos -----
payment.paymentMethodId.not-null=El medio de pago es obligatorio.
payment.reference.size=La referencia admite como máximo {max} caracteres.

# ----- Pedidos -----
order.items.not-empty=El pedido debe tener al menos un producto.
order.items.size=El pedido admite como máximo {max} líneas.
