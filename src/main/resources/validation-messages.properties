order.discount.reason.size=El motivo del descuento admite como máximo {max} caracteres.
order.serviceType.invalid=La modalidad debe ser DINE_IN (en el local) o TAKEAWAY (para llevar).
order.tableMarkerId.positive=El número de mesa no es válido.
order.customerName.size=El nombre del cliente admite como máximo {max} caracteres.
order.payments.not-empty=Debe registrar al menos un pago.
order.payments.size=El pedido admite como máximo {max} pagos.
order.status.invalid=El estado debe ser PENDING, IN_PREPARATION, READY o DELIVERED.
order.expectedVersion.not-null=Debe enviar la versión del pedido que está viendo.
order.note.size=La nota admite como máximo {max} caracteres.
order.cancelReason.not-blank=El motivo de la cancelación es obligatorio.
order.cancelReason.size=El motivo admite como máximo {max} caracteres.
